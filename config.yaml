# needed to not change the cwd but stay in current folder
hydra:
  job:
    chdir: False

#defaults:
  #- override hydra/launcher: joblib

seed: 73
cuda: 0 # use_gpu
#cuda: -1 # use cpu
env:
  env_type: pomdp
  env_name: merge-single-agent-v0

  num_eval_tasks: 10 # num of eval episodes

  duration: 15
  policy_frequency: 5
  simulation_frequency: 15

  reward_speed_range: [10, 30]
  collision_reward: 200
  #high_speed_reward: 2
  high_speed_reward: 1
  offramp_reward: 100
  HEADWAY_COST: 4
  HEADWAY_TIME: 1.2
  #MERGING_LANE_COST: 0
  MERGING_LANE_COST: 4
  LANE_CHANGE_COST: 1

  traffic_density: 3
  dutycycle: 14
  hdv_driving_style: "nominal"
  observation:
    type: LidarObservation
    enable_interference: true
    cells: 16
    # how to combine multiple interferers in line of sight of one ego radar:
    #   worst: only the strongest (closest) interferer is considered
    #   sum:   the powers of all interferers are summed
    multi_interferer: sum
    RCS: 10
    T: 10

train:
  num_iters: 2000 # number meta-training iterates
  num_init_rollouts_pool: 5 # before training
  num_rollouts_per_iter: 10

  # parallelize rollout collection with a gymnasium AsyncVectorEnv (multiprocessing).
  #   1 = serial single-env collection (original behavior).
  #   >1 = N envs stepped in parallel subprocesses; policy `act` is batched over N.
  # Keep a core free for torch (act + updates), so N ~= (num_cpus - 1) is a good start.
  num_rollout_workers: 1

  buffer_size: 500000
  batch_size: 256 # to tune based on sampled_seq_len
  num_updates_per_iter: 16
  sampled_seq_len: 20 # -1 is all, or positive integer
  sample_weight_baseline: 0.0

eval:
  eval_stochastic: false # also eval stochastic policy
  log_interval: 10 # num of iters
  save_interval: 100
  log_tensorboard: true

policy:
  separate: true
  seq_model: lstm # [lstm, gru]
  algo_name: sacd # only support sac-discrete

  action_embedding_size: 8 # no action input
  observ_embedding_size: 256
  reward_embedding_size: 8
  rnn_hidden_size: 128

  dqn_layers: [256, 256]
  policy_layers: [256, 256]
  lr: 0.0005
  gamma: 0.99
  tau: 0.005

  sacd:
    entropy_alpha:
    automatic_entropy_tuning: true
    target_entropy: 0.7 # the ratio: target_entropy = ratio * log(|A|)
    alpha_lr: 0.0005

# chkpt_path: 02-12:15-22:55.65/save/agent_1000_perf-50.783.pt
# chkpt_path: logs/pomdp/merge-single-agent-v0/sacd_lstm/gamma-0.99/len-20/bs-256/freq-16/oar/09-29:10-49:21.70/save/agent_2000_perf93.944.pt
chkpt_path: 09-30:16-48:58.99/save/agent_2000_perf89.411.pt

render: true
num_runs: 1000

metrics_dir: "ttc_metrics"
